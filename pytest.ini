[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Live tests need a running Ollama + GPU; opt in with `pytest -m live`.
# Deselected by default so CI (no Ollama/GPU) and plain `pytest` stay green.
addopts = -m "not live"
markers =
    live: requires a running Ollama instance and GPU (run with -m live)
